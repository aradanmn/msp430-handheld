[project]
name = "ex3"
mcu  = "msp430g2553"
mode = "native"

[flash]
driver = "tilib"
env    = { DYLD_LIBRARY_PATH = "~/.local/lib" }

[defaults]
cflags = ["-Wall", "-Wextra", "-g"]

